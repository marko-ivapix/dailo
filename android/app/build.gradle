import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// R49: versionName is package.json's version, and versionCode keeps every later version higher for Google Play:
// X.Y.Z-alpha.N < X.Y.Z-beta.N < X.Y.Z-rc.N < X.Y.Z (N below 300, minor and patch below 100).
def dailoVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version

def dailoVersionCode(String version) {
    def match = version =~ /^(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.(\d+))?$/
    if (!match.matches()) throw new GradleException("Unsupported version ${version} in package.json")
    def major = match.group(1) as int
    def minor = match.group(2) as int
    def patch = match.group(3) as int
    def number = match.group(5) == null ? 0 : (match.group(5) as int)
    if (minor >= 100 || patch >= 100 || number >= 300) throw new GradleException("Unsupported version ${version} in package.json")
    def stage = [alpha: 0, beta: 300, rc: 600]
    def step = match.group(4) == null ? 999 : stage[match.group(4)] + number
    return major * 10000000 + minor * 100000 + patch * 1000 + step
}

// R49: the release upload key comes from the environment (CI secrets) or Gradle properties (~/.gradle/gradle.properties),
// never from a file in git. Android Studio's "Generate Signed Bundle" injects its own key and is allowed too.
def dailoSecret(String name) {
    return System.getenv(name) ?: project.findProperty(name)
}
def dailoReleaseSigning = ['DAILO_UPLOAD_STORE_FILE', 'DAILO_UPLOAD_STORE_PASSWORD', 'DAILO_UPLOAD_KEY_ALIAS', 'DAILO_UPLOAD_KEY_PASSWORD'].every { dailoSecret(it) }

android {
    namespace = "cloud.ivapix.dailo"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "cloud.ivapix.dailo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode dailoVersionCode(dailoVersion)
        versionName dailoVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // One shared debug key for every test build (cloud and Mac), so a newer APK installs over an older one.
    // Release builds use a separate key that never enters the repository.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        upload {
            if (dailoReleaseSigning) {
                storeFile file(dailoSecret('DAILO_UPLOAD_STORE_FILE'))
                storePassword dailoSecret('DAILO_UPLOAD_STORE_PASSWORD')
                keyAlias dailoSecret('DAILO_UPLOAD_KEY_ALIAS')
                keyPassword dailoSecret('DAILO_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig dailoReleaseSigning ? signingConfigs.upload : null
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def injected = project.hasProperty('android.injected.signing.store.file')
    if (!dailoReleaseSigning && !injected && graph.allTasks.any { it.project == project && it.name in ['bundleRelease', 'assembleRelease'] }) {
        throw new GradleException('A release build needs the upload key: set DAILO_UPLOAD_STORE_FILE, DAILO_UPLOAD_STORE_PASSWORD, DAILO_UPLOAD_KEY_ALIAS and DAILO_UPLOAD_KEY_PASSWORD (docs/v2/android-izdanje.md).')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
