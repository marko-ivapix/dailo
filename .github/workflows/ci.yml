name: CI

# R48: every push and pull request runs the checks of a local release (docs/claude/TESTING_AND_RELEASE.md)
# and builds the Android debug APK, which stays downloadable from the run for two weeks.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Tests, smoke and Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run smoke
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check:python

  android:
    name: Android debug APK
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run cap:sync
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: dailo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
